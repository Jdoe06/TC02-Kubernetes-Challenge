replicaCount: 1

image:
  repository: 822424645857.dkr.ecr.us-east-1.amazonaws.com/tc02-hello-world
  tag: latest
  pullPolicy: Always

containerPort: 5001

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 5001

ingress:
  enabled: true
  className: alb
  scheme: internet-facing
  targetType: ip
  path: /

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50

